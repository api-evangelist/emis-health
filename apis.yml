  name: EMIS-X App Launch
  description: >-
    EMIS-X App Launch lets partner applications be launched in-context from within the EMIS-X / EMIS Web
    clinical workflow, passing an authenticated user and patient context to the integrating application
    via the shared EMIS-X OAuth2 / OIDC authentication.
  humanURL: https://docs.partner.emis-x.uk/emisx-app-launch/
