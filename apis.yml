aid: emis-health
url: https://raw.githubusercontent.com/api-evangelist/emis-health/refs/heads/main/apis.yml
name: EMIS Health
kind: company
description: EMIS Health is a United Kingdom health-technology company and one of
  the two dominant GP clinical-system providers in the NHS (alongside TPP SystmOne),
  supplying the EMIS Web electronic patient record used across primary care, community
  pharmacy, and other care settings. EMIS is migrating from EMIS Web to EMIS-X, a
  cloud-first platform, and exposes third-party integration through the EMIS Partner
  Developer Portal at docs.partner.emis-x.uk. The gated partner programme documents
  a RESTful JSON Partner API (PAPI) covering appointments, the clinical/medical record,
  patient demographics and matching, organisation lookup and clinical searches, plus
  EMIS-X App Launch and an EMIS-X Analytics data warehouse. Authentication is OAuth2 /
  OIDC (Microsoft Entra External ID / Azure AD B2C) using authorization-code, PKCE,
  and client-credentials flows with scoped JWT access tokens; native HL7 FHIR resource
  support is documented as upcoming rather than yet available.
