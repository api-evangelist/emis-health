apis:
- aid: emis-health:emis-partner-api
  name: EMIS Partner API (PAPI)
  description: The EMIS Partner API (PAPI) is a RESTful JSON API for EMIS-X / EMIS Web
    integration, exposing appointments, the clinical/medical record, patient demographics,
    patient matching, organisation lookup, and clinical searches. Documented as
    OpenAPI 3.0.4 (Partner API v1.2) with 40 operations across the appointments,
    medicalRecord, patient, patientMatching, organisation, search, and user domains.
    Access is OAuth2 authorization-code with scoped bearer (JWT) tokens.
  humanURL: https://docs.partner.emis-x.uk/papi-overview
