    url: https://docs.partner.emis-x.uk/auth/
- aid: emis-health:emis-x-analytics
  name: EMIS-X Analytics
  description: EMIS-X Analytics provides partner access to an EMIS-X data warehouse
    with modelled datasets across domains including Community Pharmacy, Incremental
    Primary Care Views (iPCVs), OpenSAFELY, Recruit, and IM1 Bulk Extract, browsable
    through the developer portal data explorer.
  humanURL: https://docs.partner.emis-x.uk/getting-started/
