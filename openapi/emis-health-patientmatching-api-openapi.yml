              schema:
                $ref: '#/components/schemas/PartnerApi.Service.Model.ErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerApi.Service.Model.ErrorResponse'
        '404':
          description: Not found
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/PartnerApi.Service.Model.ErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerApi.Service.Model.ErrorResponse'
        '415':
          description: Media type not valid for URL
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/PartnerApi.Service.Model.ErrorResponse'
            application/json:
              schema:
