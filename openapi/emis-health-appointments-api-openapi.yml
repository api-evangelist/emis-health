openapi: 3.2.0
info:
  title: Partner Appointments API
  version: '1.2'
tags:
- name: appointments
paths:
  /api/v1/appointments/BookAppointment:
    get:
      tags:
      - appointments
      description: This call books a patient into the specified appointment slot
      operationId: BookAppointment
      parameters:
      - name: reason
        in: query
        description: The reason for making the appointment
        required: true
        schema:
          type: string
      - name: bookedBy
        in: query
        description: DBID of staff making the appointment
        required: true
        schema:
          type: string
          format: uuid
      - name: bookingNote
        in: query
        description: Optional booking note for the appointment
        schema:
          type: string
      - name: slotId
        in: query
        description: The ID of the appointment slot
        required: true
        schema:
          type: integer
          format: int32
      - name: patientNumber
        in: query
        description: The numeric patient identifier
        required: true
        schema:
          type: integer
          format: int32
      - name: applicationId
        in: header
        description: The applicationId (aka party key) will be provided by your assurance lead
        required: true
        schema:
          type: string
      responses:
        '500':
          description: Internal error
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/PartnerApi.Service.Model.ErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerApi.Service.Model.ErrorResponse'
        '400':
          description: Bad request - adjust URL or parameters
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/PartnerApi.Service.Model.ErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerApi.Service.Model.ErrorResponse'
        '401':
          description: Authentication token not valid
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/PartnerApi.Service.Model.ErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerApi.Service.Model.ErrorResponse'
        '404':
          description: Not found
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/PartnerApi.Service.Model.ErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerApi.Service.Model.ErrorResponse'
        '415':
          description: Media type not valid for URL
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/PartnerApi.Service.Model.ErrorResponse'
            application/json:
